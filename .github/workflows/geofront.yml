name: GeoFront
on:
  push:
    paths: ["geofront/**", ".github/workflows/geofront.yml"]
  pull_request:
    paths: ["geofront/**", ".github/workflows/geofront.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: geofront

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: geofront/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: geofront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: geofront/playwright-report
          retention-days: 7

  bench:
    # Runners have no GPU, so this measures SwiftShader; it reports rather than gates
    # (see geofront/DECISIONS.md, D-005). The gating run is local: pnpm bench.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: geofront/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: geofront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: geofront/bench/results.json
          retention-days: 30
