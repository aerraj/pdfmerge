name: Windows release
on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["engine/**", "scripts/**", "src/**", "public/**", "package*.json", "src-tauri/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Cache external engines
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/engines
          key: windows-engines-libreoffice-26.2.6-tesseract-5.5.0-v1
      - run: npm ci
      - run: npm run build
      - name: Package and test PDF, Office and OCR engines
        shell: pwsh
        run: ./scripts/build-engine.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Verify installed resources
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP "pdfmerge-installed"
          $process = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PDFMERGE_TEST_ENGINE = Join-Path $destination "engine/pdfmerge-engine.exe"
          $env:PDFMERGE_RESOURCES = Join-Path $destination "engines"
          if (!(Test-Path "$destination/pdfmerge.exe")) { throw "App executable missing" }
          if (!(Test-Path $env:PDFMERGE_TEST_ENGINE)) { throw "Installed PDF engine missing" }
          python -m pytest engine/test_packaged.py -q
          if ($LASTEXITCODE -ne 0) { throw "Installed engine checks failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: pdfmerge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
