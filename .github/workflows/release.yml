name: Windows release
on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["engine/**", "scripts/**", "src/**", "src-tauri/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Cache external engines
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/engines
          key: windows-engines-libreoffice-26.2.6-tesseract-5.5.0-v1
      - run: npm ci
      - run: npm run build
      - name: Package and test PDF, Office and OCR engines
        shell: pwsh
        run: ./scripts/build-engine.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pdfmerge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
